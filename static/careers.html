<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>채용 | 기르 GIRR</title>
<meta name="description" content="주식회사 기르(GIRR)의 진행 중인 채용 공고. 글로벌 행사·투어를 함께 만들 동료를 찾습니다.">
<link rel="canonical" href="https://www.girr.co.kr/careers.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,700;0,800;1,900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="sub.css">
<style>
.jobs{display:grid;gap:16px}
.job{border:1px solid var(--line);border-top:2px solid var(--k);padding:clamp(20px,3vw,30px);display:grid;gap:14px;position:relative}
.job .tags{display:flex;flex-wrap:wrap;gap:6px}
.job .tag{font-size:12px;font-weight:600;padding:4px 10px;border:1px solid var(--line)}
.job .tag.open{background:var(--navy);border-color:var(--navy);color:#fff}
.job h2{font-size:clamp(20px,2.4vw,26px)}
.job .summary{color:var(--muted)}
.job details summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:inline-flex;align-items:center;gap:8px}
.job details summary::-webkit-details-marker{display:none}
.job details summary::before{content:"+";display:inline-grid;place-items:center;width:20px;height:20px;border:1px solid var(--k);font-size:14px;line-height:1}
.job details[open] summary::before{content:"−"}
.job .desc{white-space:pre-wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:15px}
.job .foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.job .deadline{font-size:14px;color:var(--muted)}
.state{border:1px dashed #CFCFCF;padding:40px 24px;text-align:center;color:var(--muted)}
.state b{display:block;color:var(--k);font-size:18px;margin-bottom:6px}
.skeleton{height:150px;background:linear-gradient(90deg,#F2F2F2,#FAFAFA,#F2F2F2);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.process{display:flex;margin-top:48px;border-top:1px solid var(--line);padding-top:28px;gap:0}
.process span{flex:1;position:relative;padding-top:30px;font-size:14px;font-weight:600;min-width:0}
.process span::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:var(--line)}
.process span::after{content:"";position:absolute;left:0;top:2px;width:16px;height:16px;border-radius:50%;background:var(--navy)}
.process span:last-child::before{display:none}
</style>
</head>
<body>
<header class="nav"><div class="wrap"><a class="logo" href="/">Girr<small>기르</small></a><a class="back" href="/">홈페이지로 돌아가기 →</a></div></header>

<section class="hero">
  <span class="rings" aria-hidden="true"></span>
  <div class="wrap">
    <p class="eyebrow">Careers · 채용</p>
    <h1>현장의 함성을 함께 설계할 사람을 찾습니다</h1>
    <p class="lead">행사, 투어, 플랫폼까지 기르의 기획과 운영 전반을 함께할 동료를 모십니다. 진행 중인 공고를 확인하고 바로 지원하세요.</p>
  </div>
</section>

<main>
  <div class="wrap">
    <div class="jobs" id="jobs" aria-live="polite">
      <div class="skeleton"></div><div class="skeleton"></div>
    </div>
    <div class="process" aria-label="전형 절차"><span>서류 접수</span><span>실무 과제</span><span>인터뷰</span><span>합류</span></div>
  </div>
</main>

<footer><div class="wrap"><span>© 2026 GIRR Inc.</span><a href="privacy.html">개인정보처리방침</a></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var box=document.getElementById('jobs');
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function state(t,d){box.innerHTML='<div class="state"><b>'+esc(t)+'</b>'+esc(d)+'</div>';}
  var sb;
  try{sb=supabase.createClient(window.GIRR_SUPABASE_URL,window.GIRR_SUPABASE_ANON_KEY,{auth:{persistSession:false}});}
  catch(e){state('공고를 불러오지 못했습니다','잠시 후 다시 시도해 주세요.');return;}
  var today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  sb.from('jobs').select('id,title,employment_type,location,summary,description,deadline')
    .eq('is_open',true).order('sort_order',{ascending:true}).order('created_at',{ascending:false})
    .then(function(r){
      if(r.error){state('공고를 불러오지 못했습니다','잠시 후 다시 시도해 주세요.');return;}
      var list=(r.data||[]).filter(function(j){return !j.deadline||j.deadline>=today;});
      if(!list.length){state('현재 진행 중인 채용 공고가 없습니다','새 공고가 열리면 이 페이지와 인스타그램 @girr_official_ 에서 알려드립니다.');return;}
      box.innerHTML=list.map(function(j){
        var tags='<span class="tag open">모집 중</span>'+(j.employment_type?'<span class="tag">'+esc(j.employment_type)+'</span>':'')+(j.location?'<span class="tag">'+esc(j.location)+'</span>':'');
        return '<article class="job"><div class="tags">'+tags+'</div><h2>'+esc(j.title)+'</h2>'+
          (j.summary?'<p class="summary">'+esc(j.summary)+'</p>':'')+
          (j.description?'<details><summary>상세 내용 보기</summary><div class="desc">'+esc(j.description)+'</div></details>':'')+
          '<div class="foot"><span class="deadline">'+(j.deadline?'마감 '+esc(j.deadline):'상시 채용')+'</span>'+
          '<a class="btn point" href="apply.html?job='+encodeURIComponent(j.id)+'">지원하기 →</a></div></article>';
      }).join('');
    });
})();
</script>
</body>
</html>
